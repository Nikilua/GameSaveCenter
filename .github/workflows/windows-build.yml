name: Windows 构建验证

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 编译、测试与打包
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 源码结构检查
        run: python scripts/validate-source.py

      - name: 诊断采集自测
        shell: pwsh
        run: ./scripts/tests/Test-BuildDiagnostics.ps1

      - name: 编译与测试
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -DiagnosticsRoot artifacts/build-diagnostics

      - name: 离屏渲染 QA
        shell: pwsh
        run: |
          $env:TEMP="$env:RUNNER_TEMP\qa-temp"
          $env:TMP="$env:RUNNER_TEMP\qa-temp"
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          ./scripts/render-qa.ps1

      - name: WPF UI 静态审查
        run: python .codex/skills/wpf-apple-desktop-ui/scripts/validate_wpf_ui.py .

      - name: 生成 Playnite 扩展包
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: GameSaveCenter-windows-preview
          path: |
            artifacts/GameSaveCenter-*-playnite.zip
            artifacts/GameSaveCenter-*.pext
          if-no-files-found: error

      - name: 保留构建与测试诊断（包括失败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameSaveCenter-build-diagnostics
          path: artifacts/build-diagnostics/
          if-no-files-found: warn
          retention-days: 14
